<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060818"/>
      <stop offset="100%" style="stop-color:#0e1330"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="orb1" cx="15%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:rgba(34,211,238,0.3)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <linearGradient id="orb2" cx="85%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:rgba(99,102,241,0.3)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Aurora glow orbs -->
  <circle cx="180" cy="126" r="300" fill="rgba(34,211,238,0.12)" filter="url(#blur)"/>
  <circle cx="1020" cy="504" r="320" fill="rgba(99,102,241,0.15)" filter="url(#blur)"/>

  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Stars -->
  <circle cx="100" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="300" cy="150" r="1" fill="white" opacity="0.4"/>
  <circle cx="500" cy="60" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="700" cy="120" r="1" fill="white" opacity="0.7"/>
  <circle cx="900" cy="90" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="140" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="500" r="1" fill="white" opacity="0.6"/>
  <circle cx="400" cy="550" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="600" cy="520" r="1" fill="white" opacity="0.4"/>
  <circle cx="800" cy="560" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="1000" cy="510" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="300" r="1" fill="white" opacity="0.3"/>
  <circle cx="1050" cy="320" r="1" fill="white" opacity="0.3"/>

  <!-- Name -->
  <text x="600" y="240" font-family="monospace" font-size="56" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">NAHEEL MUHAMMED PK</text>

  <!-- Role -->
  <text x="600" y="310" font-family="monospace" font-size="28" fill="url(#aurora)" text-anchor="middle" letter-spacing="4">Full Stack Developer</text>

  <!-- Tech stack -->
  <text x="600" y="370" font-family="monospace" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="1">React  ·  Next.js  ·  ASP.NET Core  ·  C#  ·  SQL Server</text>

  <!-- Divider line -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="url(#aurora)" stroke-width="1" opacity="0.4"/>

  <!-- Website -->
  <text x="600" y="470" font-family="monospace" font-size="22" fill="#cffafe" text-anchor="middle" letter-spacing="2">www.naheel.me</text>

  <!-- Bottom bar accent -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#aurora)" opacity="0.6"/>
</svg>